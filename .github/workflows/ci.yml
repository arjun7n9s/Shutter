name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test --workspace @parda/core
      - run: npm run typecheck --workspace @parda/core
      - run: npm run typecheck --workspace @parda/bench
      - run: npm run typecheck --workspace @parda/extension
      - run: npm run build --workspace @parda/extension
      - uses: actions/upload-artifact@v4
        with:
          name: parda-extension-chrome-mv3
          path: extension/.output/chrome-mv3

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  benchmark:
    runs-on: ubuntu-latest
    needs: typescript
    defaults:
      run:
        working-directory: bench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npx playwright install --with-deps chromium
      - run: npx tsx src/generate.ts && npx tsx src/run.ts
      - run: npx tsx src/heldout.ts && npx tsx src/run.ts heldout
      - run: npx tsx src/heldout2.ts && npx tsx src/run.ts heldout2
      - name: Fail if any frame was rejected by the render self-check
        run: node -e "for (const c of ['', 'heldout/', 'heldout2/']) { const r = require('./out/' + c + 'results.json'); if (r.self_check_rejects.length) { console.error(c, r.self_check_rejects); process.exit(1); } }"
      - run: cat out/summary.md out/heldout/summary.md out/heldout2/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: bench/out
