<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shutter tech stack icons</title>
<style>
  body { margin: 0; font: 15px/1.4 "Segoe UI", sans-serif; background: #f4f1ea; color: #111; }
  header { padding: 28px 32px 8px; }
  h1 { margin: 0; font-size: 28px; }
  p { margin: 6px 0 0; color: #444; }
  section { padding: 8px 32px 20px; }
  h2 { margin: 18px 0 10px; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; }
  figure { margin: 0; width: 108px; background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 12px 8px 8px; text-align: center; }
  img { width: 48px; height: 48px; object-fit: contain; }
  figcaption { margin-top: 8px; font-size: 12px; }
  figcaption b { display: block; }
  figcaption span { color: #666; }
</style>
</head>
